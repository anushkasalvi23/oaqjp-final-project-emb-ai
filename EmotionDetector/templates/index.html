<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emotion Detector</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 2rem 1rem; }
    main { max-width: 640px; margin: 0 auto; background: #fff; padding: 2rem; border-radius: 8px;
           box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { margin-top: 0; }
    textarea { width: 100%; box-sizing: border-box; padding: .6rem; font-size: 1rem; }
    button { margin-top: .75rem; padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; }
    #system_response { margin-top: 1.25rem; padding: .75rem; border-radius: 4px; min-height: 1.5rem; }
    #system_response.error { background: #fdecea; color: #b71c1c; }
    #system_response.ok { background: #e8f5e9; color: #1b5e20; }
  </style>
</head>
<body>
  <main>
    <h1>Emotion Detector</h1>
    <p>Enter a sentence to see its anger, disgust, fear, joy and sadness scores.</p>
    <label for="textToAnalyze">Text to analyze</label>
    <textarea id="textToAnalyze" rows="4" placeholder="I love this new technology"></textarea>
    <button id="runButton" type="button" onclick="RunSentimentAnalysis()">Run Emotion Detection</button>
    <div id="system_response" aria-live="polite"></div>
  </main>
  <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
